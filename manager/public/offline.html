<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <title>Cogni Cash — sem conexão</title>
    <style>
      :root {
        color-scheme: dark;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #000;
        color: #f4f7f5;
        font-family: "Segoe UI", sans-serif;
      }

      main {
        width: min(28rem, calc(100% - 2rem));
        text-align: center;
      }

      img {
        width: 4.5rem;
        height: 4.5rem;
        border-radius: 1rem;
      }

      h1 {
        margin: 1rem 0 0.5rem;
        font-size: 1.5rem;
      }

      p {
        margin: 0;
        color: #b7c4be;
        line-height: 1.5;
      }

      button {
        margin-top: 1.5rem;
        border: 0;
        border-radius: 0.75rem;
        padding: 0.75rem 1.25rem;
        background: #3dce7a;
        color: #04210f;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="Cogni Cash" />
      <h1>Sem conexão</h1>
      <p>Não foi possível abrir o Cogni Cash. Verifique sua internet e tente de novo.</p>
      <button type="button" onclick="location.reload()">Tentar novamente</button>
    </main>
  </body>
</html>
