version: '3.8'

services:
  postgres:
    container_name: cogni-cash-pg
    image: postgres
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB:  cogni-cash
      PGDATA: /data/postgres
    volumes:
      - ./data/pg:/data/postgres
