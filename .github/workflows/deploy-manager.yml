name: Deploy Manager (Vercel)

on:
  push:
    branches:
      - main
    paths:
      - "manager/**"
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: manager

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: manager/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Pull Vercel environment
        run: |
          npx vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
          npx vercel env pull .env.production.local --environment=production --yes --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Verify production env vars
        run: |
          if [ -f .env.production.local ]; then
            set -a
            . ./.env.production.local
            set +a
          fi

          if [ -z "$NEXT_PUBLIC_API_URL_PROD" ]; then
            echo "Missing NEXT_PUBLIC_API_URL_PROD."
            echo "Configure it in Vercel (Production) or GitHub Secrets."
            exit 1
          fi

          echo "Production API URL is configured."
        env:
          NEXT_PUBLIC_API_URL_PROD: ${{ secrets.NEXT_PUBLIC_API_URL_PROD }}

      - name: Build project
        run: npx vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          NEXT_PUBLIC_APP_ENV: production
          NEXT_PUBLIC_API_URL_DEV: http://localhost:3333
          NEXT_PUBLIC_API_URL_PROD: ${{ secrets.NEXT_PUBLIC_API_URL_PROD }}

      - name: Deploy to Vercel
        run: npx vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
